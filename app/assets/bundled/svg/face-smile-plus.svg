<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Add emoji: a smiling face open at its upper right for a plus, like Slack's add-reaction
       button. The ink must stay white: the renderer tints an icon with its ink and takes the
       icon's red channel as that ink's opacity. -->
  <path d="M20.5 12A8.5 8.5 0 1 1 12 3.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="9" cy="10" r="1.25" fill="white"/>
  <circle cx="15" cy="10" r="1.25" fill="white"/>
  <path d="M8.5 14.5C9.3 15.75 10.6 16.5 12 16.5C13.4 16.5 14.7 15.75 15.5 14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 2V8M16 5H22" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
